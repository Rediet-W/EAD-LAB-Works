<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Parking Spot</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />

    <link rel="stylesheet" th:href="@{/css/parking-spots.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/admin-navbar :: admin-navbar}"></div>

    <h2>Edit Parking Spot</h2>
    <form
      th:action="@{/parking-spots/admin/update/{id}(id=${parkingSpot.id})}"
      method="post"
      th:object="${parkingSpot}"
    >
      <input type="hidden" th:field="*{id}" />

      <label for="location">Location:</label>
      <input type="text" id="location" th:field="*{location}" required />
      <br />

      <label for="type">Type:</label>
      <select id="type" th:field="*{type}">
        <option value="Street" th:selected="${parkingSpot.type == 'Street'}">
          Street
        </option>
        <option value="Outdoor" th:selected="${parkingSpot.type == 'Outdoor'}">
          Outdoor
        </option>
        <option
          value="Basement"
          th:selected="${parkingSpot.type == 'Basement'}"
        >
          Basement
        </option>
      </select>
      <br />

      <label for="pricePerHour">Price Per Hour:</label>
      <input
        type="number"
        id="pricePerHour"
        th:field="*{pricePerHour}"
        step="0.1"
        required
      />
      <br />
      <label for="availableSpots">Available Spots:</label>
      <input
        type="number"
        id="availableSpots"
        th:field="*{availableSpots}"
        min="0"
        required
      />
      <br />
      <button type="submit">Save Changes</button>
    </form>

    <p><a href="/parking-spots/admin">Back to List</a></p>
  </body>
</html>
