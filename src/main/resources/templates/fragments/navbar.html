<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>ParkEase</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
  </head>
  <body th:fragment="navbar">
    <div>
      <nav>
        <!-- Left Side: Logo -->
        <div class="nav-left">
          <a href="/dashboard" class="logo">ParkEase</a>
        </div>

        <!-- Right Side: Links -->
        <div class="nav-right">
          <a href="/dashboard">Home</a>
          <a th:href="@{/bookings/user(userId=${userId})}">My Bookings</a>

          <div class="notification-container" style="position: relative">
            <span
              id="notificationBell"
              class="bell"
              onclick="toggleNotificationsDropdown()"
            >
              🔔
              <span
                id="notificationCount"
                class="notification-badge"
                style="display: none"
              ></span>
            </span>
            <div
              id="notificationsDropdown"
              class="notification-dropdown"
              style="
                display: none;
                position: absolute;
                right: 0;
                background-color: white;
                border: 1px solid #ccc;
                width: 300px;
                max-height: 400px;
                overflow-y: auto;
              "
            >
              <ul id="notificationsList"></ul>
              <!-- 🔵 Notifications will be inserted here -->
            </div>
          </div>

          <!-- Logout Button -->
          <a href="#" onclick="toggleLogoutOverlay()">Logout</a>
        </div>
      </nav>

      <!-- Logout Confirmation Overlay -->
      <div id="logout-overlay" class="overlay">
        <div class="overlay-content">
          <h2>Confirm Logout</h2>
          <p>Are you sure you want to log out?</p>
          <button onclick="document.getElementById('logout-form').submit();">
            Yes, Logout
          </button>
          <button onclick="toggleLogoutOverlay()">Cancel</button>
        </div>
      </div>

      <form
        id="logout-form"
        th:action="@{/logout}"
        method="POST"
        style="display: none"
      >
        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
      </form>

      <script>
        // Toggle the notifications dropdown
        function toggleNotificationsDropdown() {
          const dropdown = document.getElementById("notificationsDropdown");
          if (
            dropdown.style.display === "none" ||
            dropdown.style.display === ""
          ) {
            fetchNotifications();
            dropdown.style.display = "block";
          } else {
            dropdown.style.display = "none";
          }
        }

        // Fetch notifications from the backend API
        function fetchNotifications() {
          fetch("/api/notifications/list")
            .then((response) => {
              if (!response.ok) {
                throw new Error(
                  "Network response was not ok " + response.statusText
                );
              }
              return response.json();
            })
            .then((data) => {
              displayNotifications(data);
            })
            .catch((error) => {
              console.error("Error fetching notifications:", error);
            });
        }

        // Display notifications in the dropdown and update the badge
        function displayNotifications(notifications) {
          const notificationsList =
            document.getElementById("notificationsList");
          notificationsList.innerHTML = ""; // Clear existing notifications

          if (notifications.length === 0) {
            notificationsList.innerHTML =
              "<li style='padding: 10px;'>No new notifications.</li>";
          } else {
            notifications.forEach((notification) => {
              const li = document.createElement("li");
              li.style.padding = "10px";
              li.style.borderBottom = "1px solid #ddd";
              li.innerHTML = `<strong>${
                notification.message
              }</strong><br><small>${new Date(
                notification.timestamp
              ).toLocaleString()}</small>`;
              notificationsList.appendChild(li);
            });
          }

          // Update the notification count badge
          const notificationCount =
            document.getElementById("notificationCount");
          notificationCount.textContent = notifications.length;
          if (notifications.length > 0) {
            notificationCount.style.display = "inline-block";
          } else {
            notificationCount.style.display = "none";
          }
        }

        // Optionally, hide the dropdown when clicking outside
        window.onclick = function (event) {
          if (
            !event.target.matches("#notificationBell") &&
            !event.target.closest("#notificationsDropdown")
          ) {
            document.getElementById("notificationsDropdown").style.display =
              "none";
          }
        };

        function toggleLogoutOverlay() {
          document
            .getElementById("logout-overlay")
            .classList.toggle("show-overlay");
        }
      </script>
    </div>
  </body>
</html>
