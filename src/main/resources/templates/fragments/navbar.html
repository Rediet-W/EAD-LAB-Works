<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>ParkEase</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
  </head>
  <body th:fragment="navbar">
    <div >
      <nav>
        <!-- Left Side: Logo -->
        <div class="nav-left">
          <a href="/dashboard" class="logo">ParkEase</a>
        </div>

        <!-- Right Side: Links -->
        <div class="nav-right">
          <a href="/dashboard">Home</a>
          <a href="/bookings/user?userId=1">My Bookings</a>
        
<div class="notification-container">
  <span id="notification-bell" class="bell" onclick="toggleNotifications()">
    🔔
    <span id="notification-count" class="notification-badge" style="display:none;">
    </span>
  </span>
  <div id="notification-dropdown" class="notification-dropdown">
    <ul id="notification-list"></ul> <!-- 🔵 Notifications will be inserted here -->
  </div>
</div>
         

          <!-- Logout Button -->
          <a href="#" onclick="toggleLogoutOverlay()">Logout</a> </div>
        </div>
      </nav>

      <!-- Logout Confirmation Overlay -->
      <div id="logout-overlay" class="overlay">
        <div class="overlay-content">
          <h2>Confirm Logout</h2>
          <p>Are you sure you want to log out?</p>
          <button onclick="document.getElementById('logout-form').submit();">
            Yes, Logout
          </button>
          <button onclick="toggleLogoutOverlay()">Cancel</button>
        </div>
      </div>

      
      <form
        id="logout-form"
        th:action="@{/logout}"
        method="POST"
        style="display: none"
      >
        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
      </form>

      <script>
        function toggleNotifications() {
          let dropdown = document.getElementById("notification-dropdown");
          dropdown.classList.toggle("show");
          console.log("Toggled notifications dropdown");
          fetch("/notifications") 
            .then((response) => response.json())
            .then((data) => {
              let notificationList =
                document.getElementById("notification-list");
              notificationList.innerHTML = ""; 

              if (data.length === 0) {
                notificationList.innerHTML = "<li>No new notifications</li>";
              } else {
                data.forEach((notification) => {
                  let li = document.createElement("li");
                  li.textContent = notification.message;
                  notificationList.appendChild(li);
                });

                document.getElementById("notification-count").style.display =
                  "none";
              }
            });

          fetch("/notifications/mark-read", { method: "POST" });
        }

        function fetchUnreadCount() {
          fetch("/notifications")
            .then((response) => response.json())
            .then((data) => {
              let unreadCount = data.length;
              let countElem = document.getElementById("notification-count");
              if (unreadCount > 0) {
                countElem.textContent = unreadCount;
                countElem.style.display = "inline-block";
              } else {
                countElem.style.display = "none";
              }
            });
        }

        window.onload = fetchUnreadCount;

        function toggleLogoutOverlay() {
          document
            .getElementById("logout-overlay")
            .classList.toggle("show-overlay");
        }
      </script>
    </div>
  </body>
</html>
